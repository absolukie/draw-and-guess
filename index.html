<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Draw &amp; Guess</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <!-- SETUP -->
  <section id="screen-setup" class="screen active">
    <div class="card">
      <h1>🎨 Draw &amp; Guess</h1>
      <p class="sub">One phone. Take turns drawing, the other guesses out loud.</p>
      <div class="names">
        <label>Player 1 <input id="name1" maxlength="16" value="Luke" autocomplete="off"></label>
        <label>Player 2 <input id="name2" maxlength="16" value="Gabrielle" autocomplete="off"></label>
      </div>
      <div class="opt-group">
        <span class="opt-label">Rounds</span>
        <div class="pills" id="rounds-pills">
          <button data-v="4">4</button>
          <button data-v="6" class="sel">6</button>
          <button data-v="8">8</button>
          <button data-v="10">10</button>
        </div>
      </div>
      <div class="opt-group">
        <span class="opt-label">Seconds per drawing</span>
        <div class="pills" id="time-pills">
          <button data-v="30">30</button>
          <button data-v="60" class="sel">60</button>
          <button data-v="90">90</button>
        </div>
      </div>
      <div class="opt-group">
        <span class="opt-label">Word packs</span>
        <div class="checks" id="cat-checks"></div>
      </div>
      <button id="btn-start" class="big primary">Start game</button>
    </div>
  </section>

  <!-- WORD REVEAL -->
  <section id="screen-reveal" class="screen">
    <div class="card">
      <p class="pass">📱 Hand the phone to</p>
      <h2 id="reveal-drawer">Luke</h2>
      <p class="warn">Guesser, look away! 🙈</p>
      <div id="reveal-hidden">
        <button id="btn-reveal" class="big primary">Tap to reveal your word</button>
      </div>
      <div id="reveal-shown" class="hidden">
        <div class="word-card">
          <span id="reveal-cat" class="cat-tag">Food</span>
          <div id="reveal-word" class="word">Pizza</div>
        </div>
        <button id="btn-draw-start" class="big primary">Start drawing ✏️</button>
      </div>
    </div>
  </section>

  <!-- DRAW -->
  <section id="screen-draw" class="screen">
    <div id="draw-top">
      <span id="draw-round">Round 1/6</span>
      <div id="timer-wrap"><div id="timer-bar"></div><span id="timer-num">60</span></div>
      <span id="draw-scores">0 – 0</span>
    </div>
    <div id="secret-word"><span id="draw-word">Pizza</span><span id="draw-cat" class="cat-tag">Food</span></div>
    <div id="canvas-wrap"><canvas id="canvas"></canvas></div>
    <div id="tools">
      <div id="colors"></div>
      <div id="sizes">
        <button data-s="4">•</button>
        <button data-s="9" class="sel">•</button>
        <button data-s="16">•</button>
      </div>
      <button id="btn-undo" title="Undo">↩️</button>
      <button id="btn-clear" title="Clear">🗑️</button>
    </div>
    <div id="draw-actions">
      <button id="btn-skip" class="big ghost">Skip</button>
      <button id="btn-gotit" class="big primary">They got it! 🎉</button>
    </div>
  </section>

  <!-- ROUND RESULT -->
  <section id="screen-result" class="screen">
    <div class="card">
      <div id="result-emoji" class="big-emoji">🎉</div>
      <h2 id="result-title">Point!</h2>
      <p id="result-sub" class="sub"></p>
      <button id="btn-next" class="big primary">Next round →</button>
    </div>
  </section>

  <!-- GAME OVER -->
  <section id="screen-over" class="screen">
    <div class="card">
      <div class="big-emoji">🏆</div>
      <h2 id="over-title">Luke wins!</h2>
      <div id="over-scores" class="final-scores"></div>
      <button id="btn-again" class="big primary">Play again</button>
      <button id="btn-new" class="big ghost">New setup</button>
    </div>
  </section>

</div>
<script src="app.js"></script>
</body>
</html>
